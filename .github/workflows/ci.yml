name: CI

on:
  push:
    branches:
      - main
    tags:
      - v*
  schedule:
    - cron: '0 6 * * 3'
  workflow_dispatch:

permissions:
  contents: write

env:
  FIRECRACKER_VERSION: "1.18.0"
  FREEBSD_VERSION: "15.1-RELEASE"

jobs:
  kernel:
    name: Build Kernel and Rootfs (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: minimal
            script: build-freebsd.sh
            suffix: ""
          # Same kernel, plus zfs, pf, bridge and jail support as modules
          - variant: pkg-tiny
            script: build-freebsd-pkg.sh
            suffix: "-pkg-tiny"
          # The pkg-tiny userland on a zfs pool, with zfs in the kernel
          - variant: pkg-zfs
            script: build-freebsd-pkg.sh zfs
            suffix: "-pkg-zfs"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Display CPU info
        run: lscpu

      - name: Enable KVM access
        # /dev/kvm is root:kvm 0660 on GHA runners, and the runner user isn't in the kvm group
        run: |
          if sudo chmod 0666 /dev/kvm && test -w /dev/kvm; then
            echo "KVM is available and writable"
          else
            echo "::error::KVM is not available on this runner"
            ls -l /dev/kvm || true
            lsmod | grep kvm || echo "no kvm modules loaded"
            sudo dmesg | grep -i -E 'kvm|svm|vmx' || echo "no kvm-related dmesg lines"
            exit 1
          fi

      - name: Install VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -qq -o=Dpkg::Use-Pty=0 qemu-system-x86 qemu-utils cloud-image-utils

      - name: Clear additional space on runner
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /var/cache/apt/archives/*
          sudo rm -rf /usr/share/doc/*

          # https://github.com/actions/runner-images/issues/2840
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Download FreeBSD VM image
        run: |
          curl -sSL "https://download.freebsd.org/releases/VM-IMAGES/${FREEBSD_VERSION}/amd64/Latest/FreeBSD-${FREEBSD_VERSION}-amd64-BASIC-CLOUDINIT-ufs.qcow2.xz" | xz -d > freebsd.qcow2

          # Scratch disk for the source tree and build output so that we don't need to resize the official image's root filesystem
          qemu-img create -f raw work.img 5G

      - name: Set up VM
        run: |
          chmod 600 freebsd.id_rsa

          mkdir -p ~/.ssh
          cat >> ~/.ssh/config <<EOF
          Host fbsd
            HostName localhost
            Port 2222
            User root
            IdentityFile $PWD/freebsd.id_rsa
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            LogLevel ERROR
          EOF

          # cloud-init runs this (as root) on first boot
          cat > user-data <<EOF
          #!/bin/sh
          mkdir -p /root/.ssh
          chmod 700 /root/.ssh
          echo "$(cat freebsd.id_rsa.pub)" > /root/.ssh/authorized_keys
          chmod 600 /root/.ssh/authorized_keys
          sed -i '' -e 's/^#PermitRootLogin no/PermitRootLogin yes/' /etc/ssh/sshd_config
          sysrc sshd_enable=YES
          service sshd restart || service sshd start
          EOF
          echo "instance-id: freebsd-builder" > meta-data
          cloud-localds seed.iso user-data meta-data

          qemu-system-x86_64 \
            -machine q35,accel=kvm \
            -cpu host \
            -smp "$(nproc)" \
            -m 13312M \
            -drive file=freebsd.qcow2,if=virtio,format=qcow2,cache=unsafe \
            -drive file=work.img,if=virtio,format=raw,cache=unsafe \
            -cdrom seed.iso \
            -netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22 \
            -device virtio-net-pci,netdev=net0 \
            -device virtio-rng-pci \
            -display none \
            -daemonize \
            -serial file:serial.log \
            -pidfile qemu.pid

          for i in $(seq 1 60); do
            if ssh -o ConnectTimeout=5 fbsd true 2>/dev/null; then
              echo "VM is up"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "VM failed to come up; serial console output follows" >&2
              cat serial.log >&2
              exit 1
            fi
            sleep 5
          done

          scp setup-vm.sh build-freebsd.sh build-freebsd-pkg.sh prepare-rootfs.sh freebsd-tsc-init.patch freebsd-mptables.patch freebsd.id_rsa.pub fbsd:/root/
          ssh fbsd /root/setup-vm.sh
          ssh fbsd df -h

      - name: Build FreeBSD rootfs and kernel
        run: |
          ssh fbsd FREEBSD_VERSION="${FREEBSD_VERSION}" /root/${{ matrix.script }}
          ssh fbsd df -h

      - name: Prepare rootfs
        run: |
          ssh fbsd /root/prepare-rootfs.sh
          ssh fbsd df -h

      - name: Copy kernel artifacts
        run: |
          scp fbsd:/work/freebsd-kern.bin freebsd-kern${{ matrix.suffix }}.bin
          scp fbsd:/work/freebsd-rootfs.bin.xz freebsd-rootfs${{ matrix.suffix }}.bin.xz

      - name: Serve built artifacts for the boot test
        run: |
          set -eux
          wget -q -O- "https://github.com/firecracker-microvm/firecracker/releases/download/v${FIRECRACKER_VERSION}/firecracker-v${FIRECRACKER_VERSION}-x86_64.tgz" | tar zxf -
          cp "release-v${FIRECRACKER_VERSION}-x86_64/firecracker-v${FIRECRACKER_VERSION}-x86_64" firecracker
          nohup python3 -m http.server 8000 >/tmp/httpd.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:8000/freebsd-kern${{ matrix.suffix }}.bin" -o /dev/null; then break; fi
            sleep 1
          done

      - name: Boot-test with freebsd-firecracker-action
        if: matrix.variant == 'minimal'
        uses: acj/freebsd-firecracker-action@v0.13.1
        with:
          kernel-url: http://127.0.0.1:8000/freebsd-kern.bin
          rootfs-url: http://127.0.0.1:8000/freebsd-rootfs.bin.xz
          firecracker-url: http://127.0.0.1:8000/firecracker
          ssh-public-key-url: http://127.0.0.1:8000/freebsd.id_rsa.pub
          ssh-private-key-url: http://127.0.0.1:8000/freebsd.id_rsa
          checkout: false
          verbose: true
          pre-run: ""
          post-run: ""
          run-in-vm: |
            set -eux
            uname -a
            bash --version | head -1
            rsync --version | head -1
            service -e

            for f in /usr/bin/cc /usr/bin/clang /usr/bin/lldb /usr/include /rescue \
                     /usr/lib/clang /sbin/zfs /usr/sbin/dtrace /usr/sbin/bhyve \
                     /sbin/pfctl /sbin/ipfw /sbin/ipf /usr/sbin/ngctl \
                     /usr/sbin/freebsd-update /usr/sbin/mailwrapper /usr/sbin/sendmail \
                     /usr/sbin/ntpd /usr/sbin/ppp /usr/sbin/bsnmpd; do
              if [ -e "$f" ]; then echo "FAIL: $f should have been trimmed" >&2; exit 1; fi
            done
            for f in /bin/sh /usr/sbin/sshd /sbin/init /usr/local/bin/bash /usr/local/bin/rsync; do
              test -e "$f" || { echo "FAIL: $f is missing" >&2; exit 1; }
            done
            echo "trim assertions passed"

      - name: Boot-test pkg image with freebsd-firecracker-action
        if: matrix.variant != 'minimal'
        uses: acj/freebsd-firecracker-action@v0.13.1
        with:
          kernel-url: http://127.0.0.1:8000/freebsd-kern${{ matrix.suffix }}.bin
          rootfs-url: http://127.0.0.1:8000/freebsd-rootfs${{ matrix.suffix }}.bin.xz
          firecracker-url: http://127.0.0.1:8000/firecracker
          ssh-public-key-url: http://127.0.0.1:8000/freebsd.id_rsa.pub
          ssh-private-key-url: http://127.0.0.1:8000/freebsd.id_rsa
          checkout: false
          disk-size: 8G
          verbose: true
          pre-run: |
            scp oci/Containerfile firecracker:Containerfile
          post-run: ""
          run-in-vm: |
            set -eux
            uname -a
            bash --version | head -1
            rsync --version | head -1
            service -e

            # The userland is installed from base system packages
            pkg info -e FreeBSD-runtime FreeBSD-zfs FreeBSD-ssh FreeBSD-pf FreeBSD-jail FreeBSD-ipfw FreeBSD-rescue
            for p in FreeBSD-bootloader FreeBSD-devmatch FreeBSD-efi-tools \
                     FreeBSD-firmware-iwm FreeBSD-fwget FreeBSD-hyperv-tools \
                     FreeBSD-kernel-man FreeBSD-locales FreeBSD-mandoc \
                     FreeBSD-powerd FreeBSD-ppp FreeBSD-vt-data FreeBSD-wpa; do
              if pkg info -e "$p"; then echo "FAIL: $p should not be installed" >&2; exit 1; fi
            done

            for f in /usr/bin/cc /usr/bin/clang /usr/bin/lldb \
                     /usr/lib/clang /usr/sbin/dtrace /usr/sbin/bhyve /sbin/ipf \
                     /usr/sbin/ntpd /usr/sbin/ppp /usr/sbin/bsnmpd \
                     /boot/loader /boot/firmware /usr/bin/man; do
              if [ -e "$f" ]; then echo "FAIL: $f should have been trimmed" >&2; exit 1; fi
            done
            for f in /bin/sh /usr/sbin/sshd /sbin/init /usr/local/bin/bash /usr/local/bin/rsync \
                     /sbin/zfs /sbin/zpool /sbin/pfctl /sbin/dnctl /usr/sbin/jail \
                     /rescue/sh /boot/kernel/linker.hints; do
              test -e "$f" || { echo "FAIL: $f is missing" >&2; exit 1; }
            done
            echo "trim assertions passed"

            # pkg-zfs has its root on a pool, with zfs in the kernel. The
            # pool should have grown to the size of the disk on first boot.
            rootfs=$(mount -p | awk '$2 == "/" { print $3 }')
            if [ "${{ matrix.variant }}" = pkg-zfs ]; then
              test "$rootfs" = zfs
              zpool status zroot
              zfs list -r zroot
              test "$(zpool list -Hp -o size zroot)" -gt $((4 * 1024 * 1024 * 1024))
              # The pool is upgraded on first boot
              zpool get -H -o value feature@zstd_compress zroot | grep -E '^(enabled|active)$'
              test ! -e /boot/kernel/zfs.ko
            else
              test "$rootfs" = ufs
              # Nothing should be loaded until it is asked for
              if kldstat -q -m zfs; then
                echo "FAIL: zfs loaded at boot" >&2; exit 1
              fi
            fi
            if kldstat -q -m pf; then
              echo "FAIL: modules loaded at boot" >&2; exit 1
            fi
            for m in zfs pf pflog pfsync pflow dummynet if_bridge if_epair nullfs fdescfs; do
              kldstat -q -m "$m" || kldload -n "$m"
            done
            kldstat

            # Load a ruleset and enable pf. It stays on for the jail test below
            echo 'pass log all' > /tmp/pf.conf
            pfctl -f /tmp/pf.conf
            pfctl -e
            pfctl -s rules
            pfctl -s info

            # A vnet jail on a zfs dataset, bridged to the host. The jail
            # root is the host root, nullfs mounted read-only.
            md=$(mdconfig -a -t swap -s 128m)
            zpool create -m /fcpool fctest "/dev/$md"
            zfs create fctest/jail
            mount -t nullfs -o ro / /fcpool/jail

            bridge=$(ifconfig bridge create)
            ifconfig "$bridge" inet 10.99.0.1/24 up
            epair=$(ifconfig epair create)
            ifconfig "$epair" up
            ifconfig "$bridge" addm "$epair"
            jif="${epair%a}b"

            jail -c name=fcjail path=/fcpool/jail host.hostname=fcjail \
              mount.devfs vnet vnet.interface="$jif" persist
            jexec fcjail ifconfig lo0 inet 127.0.0.1/8 up
            jexec fcjail ifconfig "$jif" inet 10.99.0.2/24 up
            jls -v
            ifconfig "$bridge"
            ping -c 3 -t 15 10.99.0.2
            jexec fcjail ping -c 3 -t 15 10.99.0.1

            # jail -r without a jail.conf leaves the devfs mount behind
            jail -r fcjail
            ifconfig "$epair" destroy
            ifconfig "$bridge" destroy
            umount /fcpool/jail/dev
            umount /fcpool/jail
            zpool destroy fctest
            mdconfig -d -u "$md"
            echo "module and jail assertions passed"

            # podman with ocijail, image storage on zfs and container
            # networking through pf. pf is still enabled from above.
            pkg install -y podman
            if [ "$rootfs" = zfs ]; then
              pool=zroot
            else
              pool=fcpod
              truncate -s 5g /var/tmp/fcpod.img
              md=$(mdconfig -a -t vnode -f /var/tmp/fcpod.img)
              zpool create -m none fcpod "/dev/$md"
            fi
            zfs create -o mountpoint=/var/db/containers -o compression=zstd "$pool/containers"
            mount -t fdescfs fdesc /dev/fd

            egress=$(route -n get default | awk '/interface:/ { print $2 }')
            gateway=$(route -n get default | awk '/gateway:/ { print $2 }')
            sed "s/ix0/$egress/" /usr/local/etc/containers/pf.conf.sample > /etc/pf.conf
            echo 'pass log all' >> /etc/pf.conf
            pfctl -f /etc/pf.conf
            pfctl -s nat

            podman info
            image=ghcr.io/freebsd/freebsd-runtime:15.1
            podman run --rm "$image" freebsd-version
            podman run --rm "$image" ping -c 3 -t 15 "$gateway"

            # Build the test environment image, without the ports packages
            # to keep it short, and compile something in it
            podman build --build-arg PORTS=pkgconf -t fc-test-env -f Containerfile .
            podman run --rm --user ci fc-test-env /bin/sh -c \
              'echo "int main(void){return 0;}" > t.c && cc -o t t.c && ./t && kyua help > /dev/null'
            podman images
            zfs list -r "$pool"
            echo "podman assertions passed"

      - name: Upload serial console log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: serial-console-${{ matrix.variant }}.log
          path: serial.log
          if-no-files-found: ignore

      - name: Archive kernel artifact
        uses: actions/upload-artifact@v7
        with:
          name: freebsd-kern${{ matrix.suffix }}.bin
          path: freebsd-kern${{ matrix.suffix }}.bin
    
      - name: Archive rootfs artifact
        uses: actions/upload-artifact@v7
        with:
          name: freebsd-rootfs${{ matrix.suffix }}.bin.xz
          path: freebsd-rootfs${{ matrix.suffix }}.bin.xz
  
  firecracker:
    name: Vendor Firecracker binary
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download binary
        run: |
          wget -q -O- https://github.com/firecracker-microvm/firecracker/releases/download/v${{ env.FIRECRACKER_VERSION}}/firecracker-v${{ env.FIRECRACKER_VERSION}}-x86_64.tgz | tar zxf -
          mv release-v${{ env.FIRECRACKER_VERSION}}-x86_64/firecracker-v${{ env.FIRECRACKER_VERSION}}-x86_64 firecracker

      - name: Archive artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firecracker
          path: firecracker
  
  ssh-keys:
    name: Archive SSH keys
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Archive SSH public key
        uses: actions/upload-artifact@v7
        with:
          name: freebsd.id_rsa.pub
          path: freebsd.id_rsa.pub
        
      - name: Archive SSH private key
        uses: actions/upload-artifact@v7
        with:
          name: freebsd.id_rsa
          path: freebsd.id_rsa

  # Build oci/Containerfile with podman in the pkg-tiny image and push it to
  # ghcr.io/skunkwerks. A FreeBSD image has to be built on FreeBSD, so this
  # cannot run on the Linux runner itself.
  image:
    name: Publish test environment image
    needs: [firecracker, kernel]
    if: github.repository_owner == 'skunkwerks'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enable KVM access
        run: sudo chmod 0666 /dev/kvm && test -w /dev/kvm

      - name: Download firecracker artifact
        uses: actions/download-artifact@v7
        with:
          name: firecracker

      - name: Download pkg-tiny kernel artifact
        uses: actions/download-artifact@v7
        with:
          name: freebsd-kern-pkg-tiny.bin

      - name: Download pkg-tiny rootfs artifact
        uses: actions/download-artifact@v7
        with:
          name: freebsd-rootfs-pkg-tiny.bin.xz

      - name: Serve the artifacts for the VM action
        run: |
          set -eux
          nohup python3 -m http.server 8000 >/tmp/httpd.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/freebsd-kern-pkg-tiny.bin -o /dev/null; then break; fi
            sleep 1
          done

      - name: Build and push the image in a FreeBSD VM
        uses: acj/freebsd-firecracker-action@v0.13.1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          kernel-url: http://127.0.0.1:8000/freebsd-kern-pkg-tiny.bin
          rootfs-url: http://127.0.0.1:8000/freebsd-rootfs-pkg-tiny.bin.xz
          firecracker-url: http://127.0.0.1:8000/firecracker
          ssh-public-key-url: http://127.0.0.1:8000/freebsd.id_rsa.pub
          ssh-private-key-url: http://127.0.0.1:8000/freebsd.id_rsa
          checkout: false
          disk-size: 16G
          pre-run: |
            scp oci/Containerfile firecracker:Containerfile
            printf '%s\n' "$GHCR_TOKEN" | ssh firecracker 'umask 077; cat > ghcr.token'
          post-run: ""
          run-in-vm: |
            set -eu
            image=ghcr.io/skunkwerks/freebsd-firecracker-env
            version=$(freebsd-version -u | cut -d- -f1)

            pkg install -y podman
            truncate -s 12g /var/tmp/fcpod.img
            md=$(mdconfig -a -t vnode -f /var/tmp/fcpod.img)
            zpool create -m none -O compression=zstd fcpod "/dev/$md"
            zfs create -o mountpoint=/var/db/containers fcpod/containers
            mount -t fdescfs fdesc /dev/fd

            egress=$(route -n get default | awk '/interface:/ { print $2 }')
            sed "s/ix0/$egress/" /usr/local/etc/containers/pf.conf.sample > /etc/pf.conf
            echo 'pass all' >> /etc/pf.conf
            kldload -n pf
            pfctl -f /etc/pf.conf
            pfctl -e

            podman build -t "$image:$version" \
              --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
              -f Containerfile .
            podman run --rm --user ci "$image:$version" /bin/sh -c \
              'echo "int main(void){return 0;}" > t.c && cc -o t t.c && ./t && cargo --version'
            podman images

            podman login -u ${{ github.actor }} --password-stdin ghcr.io < ghcr.token
            rm -f ghcr.token
            podman push "$image:$version"
            if [ "${{ github.ref_type }}" = tag ]; then
              podman tag "$image:$version" "$image:${{ github.ref_name }}"
              podman push "$image:${{ github.ref_name }}"
            fi

  release:
    name: Publish release
    needs: [firecracker, kernel, ssh-keys]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04

    steps:
      - name: Download firecracker artifact
        uses: actions/download-artifact@v7
        with:
          name: firecracker
          path: firecracker
      
      - name: Download kernel artifact
        uses: actions/download-artifact@v7
        with:
          name: freebsd-kern.bin
          path: freebsd-kern.bin

      - name: Download rootfs artifact
        uses: actions/download-artifact@v7
        with:
          name: freebsd-rootfs.bin.xz
          path: freebsd-rootfs.bin.xz

      - name: Download pkg-tiny kernel artifact
        uses: actions/download-artifact@v7
        with:
          name: freebsd-kern-pkg-tiny.bin
          path: freebsd-kern-pkg-tiny.bin

      - name: Download pkg-tiny rootfs artifact
        uses: actions/download-artifact@v7
        with:
          name: freebsd-rootfs-pkg-tiny.bin.xz
          path: freebsd-rootfs-pkg-tiny.bin.xz

      - name: Download pkg-zfs kernel artifact
        uses: actions/download-artifact@v7
        with:
          name: freebsd-kern-pkg-zfs.bin
          path: freebsd-kern-pkg-zfs.bin

      - name: Download pkg-zfs rootfs artifact
        uses: actions/download-artifact@v7
        with:
          name: freebsd-rootfs-pkg-zfs.bin.xz
          path: freebsd-rootfs-pkg-zfs.bin.xz

      - name: Download SSH public key
        uses: actions/download-artifact@v7
        with:
          name: freebsd.id_rsa.pub
          path: freebsd.id_rsa.pub

      - name: Download SSH private key
        uses: actions/download-artifact@v7
        with:
          name: freebsd.id_rsa
          path: freebsd.id_rsa

      - uses: marvinpinto/action-automatic-releases@919008cf3f741b179569b7a6fb4d8860689ab7f0 # v1.1.1
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          # Without a tag given, the action takes only semantic versions
          # and refuses a tag like v0.13.0.1
          automatic_release_tag: "${{ github.ref_name }}"
          title: "${{ github.ref_name }}"
          draft: true
          prerelease: false
          files: |
            firecracker
            freebsd-kern.bin
            freebsd-rootfs.bin.xz
            freebsd-kern-pkg-tiny.bin
            freebsd-rootfs-pkg-tiny.bin.xz
            freebsd-kern-pkg-zfs.bin
            freebsd-rootfs-pkg-zfs.bin.xz
            freebsd.id_rsa.pub
            freebsd.id_rsa
